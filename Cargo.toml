[workspace]
members = ["crates/shared", "crates/source", "crates/app"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
anyhow = "1"
windows-bindgen = "0.100"
windows-core = "0.100"
windows-services = "0.100"
eosvcam-shared = { path = "crates/shared" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

# Clippy is strict by default, so a plain `cargo clippy` already fails on warnings.
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
