name: Main

on:
    push:
        branches: [ main ]
        paths:
            - '.cargo/**'
            - 'Cargo.toml'
            - 'Cargo.lock'
            - 'crates/**'
            - 'package/**'
            - 'scripts/**'
    workflow_dispatch:

concurrency:
    group: main
    cancel-in-progress: true

jobs:
    audit:
        uses: ./.github/workflows/audit.yml
    test:
        uses: ./.github/workflows/test.yml
